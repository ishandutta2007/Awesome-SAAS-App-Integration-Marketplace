<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <!-- Styles & Animations -->
    <style>
      .glow-pulse-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .glow-pulse-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .float-pill-1 {
        animation: floatPill1 6s ease-in-out infinite alternate;
      }
      .float-pill-2 {
        animation: floatPill2 7s ease-in-out infinite alternate;
      }
      .float-pill-3 {
        animation: floatPill3 5.5s ease-in-out infinite alternate;
      }
      .flow-pulse {
        stroke-dasharray: 8, 8;
        animation: dashMove 20s linear infinite;
      }

      @keyframes pulse1 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
        100% { transform: scale(1.15) translate(30px, 20px); opacity: 0.7; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        100% { transform: scale(1.2) translate(-25px, -15px); opacity: 0.65; }
      }
      @keyframes floatPill1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes floatPill2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(12px); }
      }
      @keyframes floatPill3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Ambient Nebula Glows (Background only) -->
  <circle cx="200" cy="100" r="180" fill="url(#glowGrad1)" class="glow-pulse-1" filter="blur(40px)" />
  <circle cx="1020" cy="260" r="190" fill="url(#glowGrad2)" class="glow-pulse-2" filter="blur(40px)" />

  <!-- Overlay Grid -->
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Dynamic Connector / Network Flow Lines in Background -->
  <g opacity="0.35">
    <path d="M 120 180 Q 300 80, 600 180 T 1080 180" fill="none" stroke="#60a5fa" stroke-width="2" class="flow-pulse" />
    <path d="M 120 220 Q 400 320, 600 220 T 1080 220" fill="none" stroke="#c084fc" stroke-width="1.5" class="flow-pulse" style="animation-direction: reverse;" />
  </g>

  <!-- Floating Feature Pills (Kept at top and bottom margins to not overlap text) -->
  <g class="float-pill-1" transform="translate(140, 42)">
    <rect width="180" height="34" rx="17" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="34" y="22" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ Connectors Hub</text>
  </g>

  <g class="float-pill-2" transform="translate(860, 42)">
    <rect width="200" height="34" rx="17" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#c084fc" />
    <text x="34" y="22" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🧩 Plugin Registries</text>
  </g>

  <g class="float-pill-3" transform="translate(500, 305)">
    <rect width="210" height="34" rx="17" fill="url(#cardGrad1)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="17" r="5" fill="#f472b6" />
    <text x="34" y="22" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🌐 Self-Hosted &amp; Cloud</text>
  </g>

  <!-- Central Foreground Content (High Visibility & Legibility) -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="425" y="100" width="350" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="600" y="119" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      ENTERPRISE ECOSYSTEM DIRECTORY
    </text>

    <!-- Main Title with Gradient -->
    <text x="600" y="175" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5">
      SaaS App Integration Marketplace
    </text>

    <!-- Subtitle in foreground -->
    <text x="600" y="215" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="500">
      Curated List of SaaS Marketplaces, App Stores &amp; Open-Source Plugin Registries
    </text>

    <!-- Supporting Tagline -->
    <text x="600" y="248" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      App Directories • Third-Party Developer Portals • Connector Frameworks • Self-Hosted Registries
    </text>
  </g>
</svg>